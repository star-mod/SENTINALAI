pipeline:
  target_fps: 15
  ring_buffer_seconds: 10
  device: "auto"
  model_name: "yolov8n-pose.pt"
  cooldown_seconds: 20.0

detectors:
  fall_collapse:
    enabled: true
    window_seconds: 2.5
    frames_required: 15
    confidence_min: 0.70
    drop_velocity_threshold: 0.08
    aspect_ratio_threshold: 1.15
    stillness_threshold: 0.04

  physical_altercation:
    enabled: true
    window_seconds: 2.5
    frames_required: 18
    confidence_min: 0.72
    proximity_threshold: 0.25
    wrist_velocity_threshold: 0.06
    rapid_approach_threshold: 0.08

  abnormal_crowd_movement:
    enabled: true
    window_seconds: 2.5
    frames_required: 20
    confidence_min: 0.75
    optical_flow_spike_factor: 2.2
    direction_divergence_threshold: 0.40
    min_people_for_crowd: 3

evidence:
  clip_pre_seconds: 3.0
  clip_post_seconds: 3.0
  snapshots_dir: "./media/snapshots"
  clips_dir: "./media/clips"
